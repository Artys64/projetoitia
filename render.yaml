# Homologação: revisar região, recursos pagos e segredos antes de aplicar.
# DATABASE_URL usa support_hub_app; MIGRATION_DATABASE_URL usa o proprietário.
services:
  - type: web
    name: support-hub-api-staging
    runtime: node
    region: virginia
    plan: 0.5c-512mb
    autoDeployTrigger: "off"
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run db -- migrate && npm run db -- provision
    startCommand: npm run start -w @support-hub/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.20.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        fromDatabase:
          name: support-hub-db-staging
          property: connectionString
      - key: APP_DATABASE_PASSWORD
        sync: false
  - type: worker
    name: support-hub-worker-staging
    runtime: node
    region: virginia
    plan: 0.5c-512mb
    autoDeployTrigger: "off"
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start -w @support-hub/worker
    envVars:
      - key: NODE_VERSION
        value: 24.20.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromService:
          name: support-hub-api-staging
          type: web
          envVarKey: DATABASE_URL
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
databases:
  - name: support-hub-db-staging
    region: virginia
    plan: 0.1c-256mb
    diskSizeGB: 5
    postgresMajorVersion: "18"
    databaseName: support_hub
    user: support_hub_owner
    ipAllowList: []
