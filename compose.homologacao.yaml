# PostgreSQL exclusivo para homologação local. API e worker rodam no host.
# Uso: docker compose --env-file .env.homologacao.db -f compose.homologacao.yaml up -d --wait
name: support-hub-homologacao
services:
  db:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    environment:
      POSTGRES_DB: support_hub_homologacao
      POSTGRES_USER: support_hub_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD em .env.homologacao.db}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support_hub_owner -d support_hub_homologacao"]
      interval: 5s
      timeout: 5s
      retries: 12
    stop_grace_period: 30s
  embeddings:
    build: ./services/embeddings-local
    environment:
      EMBEDDING_MODEL_PATH: /models/multilingual-e5-small
      EMBEDDING_MODEL_REVISION: fd1525a9fd15316a2d503bf26ab031a61d056e98
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./models/multilingual-e5-small:/models/multilingual-e5-small:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=10)"]
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 60s
volumes:
  postgres_data:
